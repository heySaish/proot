name: Build PRoot ARM64

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build PRoot ARM64 (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compile PRoot & Loader (Native ARM64 Container)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:24.04 \
            bash -c "
              set -e
              apt-get update -qq
              apt-get install -qq -y gcc make libtalloc-dev uthash-dev
              make -C src clean
              make -C src loader.elf build.h proot WITHOUT_PYTHON=1 -j\$(nproc)
              mkdir -p dist-arm64
              cp src/proot dist-arm64/proot-aarch64
              cp src/loader.elf dist-arm64/libproot.so
              cp src/proot dist-arm64/libproot-xed.so
              strip --strip-unneeded dist-arm64/*
            "

      - name: List Artifacts
        run: ls -lh dist-arm64/

      - name: Upload PRoot ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: dist-arm64/
          retention-days: 90
